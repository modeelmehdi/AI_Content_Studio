[build]
command = "npm --prefix frontend ci && npm --prefix frontend run build"
publish = "frontend/dist"
[[redirects]]
from = "/api/*"
to = "https://modeel-ai-content-studio-api.vercel.app/api/:splat"
status = 200
force = true
[[redirects]]
from = "/health"
to = "https://modeel-ai-content-studio-api.vercel.app/health"
status = 200
force = true
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
