services:
  - type: web
    name: ai-content-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_BACKEND
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ai_content_studio
      - key: JWT_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        sync: false
      - key: GEMINI_IMAGE_MODEL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
